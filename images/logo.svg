<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Metawood Interiors</title>
  <desc id="desc">Gold circular MW monogram and gold Metawood Interiors wordmark on a deep navy background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="78%">
      <stop offset="0" stop-color="#062044"/>
      <stop offset="1" stop-color="#00132e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#d99513"/>
      <stop offset="0.28" stop-color="#ffe16a"/>
      <stop offset="0.55" stop-color="#fff2a0"/>
      <stop offset="0.78" stop-color="#f6c33c"/>
      <stop offset="1" stop-color="#d58b08"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff1a0"/>
      <stop offset="0.55" stop-color="#f3b92b"/>
      <stop offset="1" stop-color="#b96c00"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <circle cx="768" cy="368" r="269" fill="#9b6500" opacity=".55"/>
  <circle cx="768" cy="363" r="264" fill="url(#gold)" stroke="url(#rim)" stroke-width="10"/>
  <path d="M540 487 L653 270 L730 432 L812 270 L889 432 L996 270" fill="none" stroke="#001a3a" stroke-width="22" stroke-linecap="butt" stroke-linejoin="miter"/>
  <text x="768" y="770" text-anchor="middle" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="119" letter-spacing="1.5">METAWOOD INTERIORS</text>
  <g fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="35" letter-spacing="13">
    <text x="768" y="855" text-anchor="middle">MEET YOUR EXPECTATIONS ON INTERIOR</text>
  </g>
  <path d="M73 841 H188 M1348 841 H1463" stroke="url(#gold)" stroke-width="4"/>
</svg>
